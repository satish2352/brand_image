; Media import uploads one Excel/CSV plus an images ZIP in a single POST.
; The app allows a 50MB ZIP (config/fileConstants.php IMAGE_IMPORT_ZIP_MAX_KB),
; so post_max_size must stay comfortably above that or the request is rejected
; with a 413 PostTooLargeException before Laravel validation ever runs.
post_max_size = 64M
upload_max_filesize = 60M
max_file_uploads = 40
memory_limit = 512M

; max_input_time bounds the time PHP may spend RECEIVING the request body, so a
; slow uplink spends it just streaming the ZIP up — a 50MB archive on a ~0.6Mbps
; connection needs ~11 minutes and blew straight through the old 300s ceiling,
; which PHP reports as a truncated upload (UPLOAD_ERR_PARTIAL, 0 bytes) and the
; browser sees as ERR_CONNECTION_RESET. Sized for a slow upload of a full ZIP,
; not for how long the parsing afterwards takes.
max_input_time = 900

; Extracting the ZIP and reading the sheet happens after the upload lands, on
; its own clock.
max_execution_time = 900
